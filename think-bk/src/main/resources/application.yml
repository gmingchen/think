spring:
  profiles:
    active: test # 环境 dev|test|prod
  jackson:
    time-zone: GMT+8 # 时区
    date-format: yyyy-MM-dd HH:mm:ss # 时间格式化
    deserialization:
      FAIL_ON_UNKNOWN_PROPERTIES: false # json中含pojo不存在属性时是否失败报错
  #    default-property-inclusion: non_null # 为 null 时字段不进行序列化 减少流量
  servlet:
    multipart:
      max-file-size: 10MB # 单个文件最大
      max-request-size: 100MB # 总上传数据最大
      enabled: true # 是否启用
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      # 单数据源
      driver-class-name: com.mysql.cj.jdbc.Driver # 数据库驱动名称
      url: jdbc:mysql://${database.ip}:${database.port}/${database.name}?allowMultiQueries=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false # url
      username: ${database.username} # 用户名
      password: ${database.password} # 密码
      initial-size: 10 # 初始化大小
      max-active: 100 # 最大个数
      min-idle: 10 # 最小个数
      max-wait: 60000 # 最大等待时间
      time-between-eviction-runs-millis: 60000 # 间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      min-evictable-idle-time-millis: 300000 # 最小生存时间
      max-evictable-idle-time-millis: 600000 # 最大生存时间
      #validation-query: SELECT 1 FROM DUAL # 用来检测连接是否有效的sql TODO:Oracle 需要使用
      test-on-return: false # 在连接归还到连接池时是否测试该连接
      test-on-borrow: false # 获取连接时候验证
      test-while-idle: true # 验证连接的有效性
      pool-prepared-statements: false # 是否缓存preparedStatement，TODO:比如说oracle。在mysql下建议关闭。
      keep-alive: true # 连接池中的minIdle数量以内的连接，空闲时间超过minEvictableIdleTimeMillis，则会执行keepAlive操作
      stat-view-servlet: # 监控
        enabled: true #是否启用StatViewServlet TODO: 启用建议设置密码或白名单
        reset-enable: true # 是否允许清空统计数据
        url-pattern: ${database.statViewServlet.url-pattern} # 页面路径
        login-username: ${database.statViewServlet.username} # 用户名
        login-password: ${database.statViewServlet.password} # 密码
        # 访问控制
        allow: 127.0.0.1,172.19.5.159,47.103.87.88,172.23.104.213,47.116.207.3
#        allow: 128.242.127.1/24,128.242.128.1
        #deny: 128.242.127.4
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 100
        wall:
          enabled: true
          config:
            multi-statement-allow: true # 是否允许一次执行多条语句

  redis:
    database: ${redis.database}
    host: ${redis.host}
    port: ${redis.port}
    password: ${redis.password}
    timeout: 10000ms
    jedis:
      pool:
        max-active: 1000
        max-wait: -1ms
        max-idle: 10
        min-idle: 5
  security:
    user:
      password: password

server:
  port: ${service.port} # 启动端口
  servlet:
    context-path: ${service.context-path} # 项目路径
  tomcat:
    uri-encoding: utf-8 # 编码
    connection-timeout: 5000ms # 连接超时
    threads:
      max: 1000 # 最大线程数
      min-spare: 30 # 最小闲置线程

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml # mapper路径 多个用逗号隔开
  type-aliases-package: com.think.**.entity # 实体路径 多个用逗号隔开
  global-config:
    db-config:
      id-type: auto # 主键类型 AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID"
      table-underline: true # 表名是否使用驼峰转下划线命名,只对表名生效
      # 字段验证策略 IGNORED:"忽略判断",NOT_NULL:"非 NULL 判断",NOT_EMPTY:"非空判断"
      insert-strategy: NOT_EMPTY
      update-strategy: NOT_NULL
      logic-delete-field: deleted # 逻辑删除字段
      logic-delete-value: 1 # 已删除值
      logic-not-delete-value: 0 # 未删除值
    banner: false # 是否控制台 print mybatis-plus 的 LOGO
  configuration:
    map-underscore-to-camel-case: true # 是否开启自动驼峰命名规则
    cache-enabled: false # 是否开启Mybatis二级缓存
    call-setters-on-nulls: true # 指定当结果集中值为 null 的时候是否调用映射对象的 Setter（Map 对象时为 put）方法，通常运用于有 Map.keySet() 依赖或 null 值初始化的情况
    jdbc-type-for-null: 'null' # 当没有为参数指定特定的 JDBC 类型时，空值的默认 JDBC 类型

json-web-token: # json web token
  jwt:
    key: token # token 键值
    secret: f633c20c0cc243b1a76141a051c1b4d4e23d011e969d420d9ac95aff8bb1011b # 秘钥
    expire: 86400 # 过期时间（秒）

wechat:
    appId: wx73abf984ff1e6d0f
    appSecret: 055145f31cec0984ab65924d1efe2436
    template:
      dailyReminder: CFRZYXIcw3ifgwXIM0_9efD2BireRn5RSkSt2Hsd0uY

# 对象存储（qiniu / aliyun / tencent）
storage:
  type: qiniu
  qiniu:
    access-key: ${qiniu.accessKey:}
    secret-key: ${qiniu.secretKey:}
    bucket: mx-think
    region: huadong
    domain: ${qiniu.domain:}

# AI 荐菜（成长计划赠送额度仅限小程序 SDK / 云函数消耗，故经 CloudBase 云函数 llm-proxy 中转）
# url 为空视为未开通 AI 能力；proxy-key 与云函数 process.env.PROXY_KEY 必须一致
ai:
  llm:
    url: ${ai-llm.url:}
    proxy-key: ${ai-llm.proxyKey:}
    model: hy3
    temperature: 0.7
    timeout: 50000        # 单次 LLM 调用超时（毫秒），需低于前端 recommend 的 60s，避免后端仍在跑前端已超时却扣了次数
    daily-limit: 3        # 每人每日推荐次数上限（本文件是唯一数值源，dev/prod 不再覆盖；test=999 调试放大）
    parse-daily-limit: 5  # 每人每日文案识别次数上限（独立预算，仅 parse 计数；test=999 调试放大）
    pro-daily-limit: 20        # 畅厨会员每日推荐上限（轻享不加量、走 base；§6.5 畅厨分层）
    pro-parse-daily-limit: 30  # 畅厨会员每日文案识别上限（轻享不加量；§6.5）
    recommend-expire: 86400  # 推荐结果 Redis 暂存有效期（秒），即采纳凭证有效期

# AI 封面生图（成长计划二期赠送 10 万张额度仅限小程序 SDK / 云函数消耗，故经 CloudBase 云函数 image-proxy 中转）
# url 为空视为未开通生图能力；proxy-key 与云函数 process.env.PROXY_KEY 必须一致（与 llm-proxy 共用同值）
# 云函数内部走 ai.createImageModel('hunyuan-image').generateImage(...)，合规水印由云函数传 footnote 在右下角烧入
  image:
    url: ${ai-image.url:}
    proxy-key: ${ai-image.proxyKey:}
    model: HY-Image-3.0-Plus-4090-Tob-v1.0   # 二期赠额对应模型（一期 hunyuan-image-v3.0-v1.0.4 已于 2026-07-15 下线）；下传给云函数，换型号只改本行
    size: 1024x1024       # 混元只认「宽x高」；可选 1024x1024 / 1280x720 / 720x1280 / 1280x1280，本项固定方形与菜谱封面比例一致
    timeout: 130000       # 单次生图调用超时（毫秒），需 ≥ 云函数侧 120s，避免后端仍在跑前端已超时却扣了次数
    daily-limit: 2        # 每人每日生图次数上限（本文件是唯一数值源；test=999 调试放大）
    pro-daily-limit: 10   # 畅厨会员每日生图上限（轻享不加量；§6.5，生图提额=真实赠额成本）
