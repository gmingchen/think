<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- 品牌主色渐变 -->
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E75C9" />
      <stop offset="100%" stop-color="#3B5BA5" />
    </linearGradient>
  </defs>

  <!-- 圆角方形底座 (小程序标准圆角) -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" fill="url(#avatarGrad)" />

  <!-- 图形主体：居中对称 (缩放 1.5，保证 border-radius 50% 时下横不超圆形边缘) -->
  <g transform="translate(512, 512) scale(1.5)">
    <!-- 上横：思危 (宽 460) -->
    <rect x="-230" y="-174" width="460" height="48" rx="24" fill="#FFFFFF" />
    
    <!-- 中横：思退 (总跨度 340，左右短线宽 112，两端严格收敛在上下两横内) -->
    <rect x="-170" y="-24" width="112" height="48" rx="24" fill="#FFFFFF" />
    <!-- 核心决策点：印章红 -->
    <circle cx="0" cy="0" r="38" fill="#B23C2E" />
    <rect x="58" y="-24" width="112" height="48" rx="24" fill="#FFFFFF" />

    <!-- 下横：思变 (宽 550，最长基底) -->
    <rect x="-275" y="126" width="550" height="48" rx="24" fill="#FFFFFF" />
  </g>
</svg>