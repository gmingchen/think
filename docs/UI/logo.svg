<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="480" height="160">
  <!-- 左侧等比微调后的图标 -->
  <g transform="translate(72, 80) scale(0.18)">
    <!-- 上横 (原 460 -> 82.8) -->
    <rect x="-230" y="-174" width="460" height="48" rx="24" fill="#3B5BA5" />
    
    <!-- 中横收敛短线 (原 112 -> 20.16) + 红点 -->
    <rect x="-170" y="-24" width="112" height="48" rx="24" fill="#3B5BA5" />
    <circle cx="0" cy="0" r="38" fill="#B23C2E" />
    <rect x="58" y="-24" width="112" height="48" rx="24" fill="#3B5BA5" />

    <!-- 下横 (原 550 -> 99) -->
    <rect x="-275" y="126" width="550" height="48" rx="24" fill="#3B5BA5" />
  </g>

  <!-- 纵向微透明分割线 -->
  <line x1="145" y1="46" x2="145" y2="114" stroke="#4E75C9" stroke-width="1.5" opacity="0.4" />

  <!-- 文字标：宋体衬线 + 宽字距 -->
  <text x="175" y="82" font-family="&#39;Source Han Serif SC&#39;, &#39;Noto Serif SC&#39;, &#39;Songti SC&#39;, serif" font-size="34" font-weight="600" fill="#3B5BA5" letter-spacing="9">众三思</text>
  
  <!-- Slogan 小字 -->
  <text x="176" y="112" font-family="&#39;Source Han Sans SC&#39;, &#39;PingFang SC&#39;, sans-serif" font-size="11.5" font-weight="400" fill="#4E75C9" letter-spacing="2" opacity="0.9">集众人所见 · 众三思而后抉择</text>
</svg>